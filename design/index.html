<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasky — design prototype</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="root"></div>

<!-- Templates ---------------------------------------------------------- -->

<template id="tpl-login">
  <div class="login">
    <form class="login-card" novalidate>
      <p class="eyebrow">Tasky</p>
      <h1>Sign in</h1>
      <p class="login-note">Accounts are created by an admin. Membership in any project is invite-only.</p>
      <label class="field">
        <span>Username</span>
        <input name="username" autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" data-error hidden></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="login-hint">Try <code>asha</code>, <code>kabir</code> or <code>lena</code> — any password</p>
    </form>
  </div>
</template>

<template id="tpl-shell">
  <header class="topbar">
    <a class="brand" href="#/projects">Tasky</a>
    <nav class="nav">
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/fields" data-nav="fields">Fields</a>
      <a href="#/screens" data-nav="screens">Screens</a>
      <a href="#/labels" data-nav="labels">Labels</a>
    </nav>
    <div class="topbar-end">
      <span class="who" data-who></span>
      <button class="btn btn-quiet" data-signout>Sign out</button>
    </div>
  </header>
  <main class="main" data-main></main>
</template>

<template id="tpl-projects">
  <div class="page page-narrow">
    <div class="page-head">
      <h1>Projects</h1>
      <p class="page-sub">Everything you're a member of. No one joins without an invite.</p>
    </div>

    <section class="invitations" data-invitations hidden>
      <h2 class="section-label">Pending invitations</h2>
      <ul class="invite-list" data-invite-list></ul>
    </section>

    <form class="create-project" data-create-project novalidate>
      <input name="name" placeholder="Project name" aria-label="Project name" required>
      <input name="key" placeholder="KEY" aria-label="Project key" maxlength="10" class="key-input" required>
      <button class="btn btn-primary" type="submit">Create project</button>
    </form>
    <p class="form-error" data-create-error hidden></p>

    <ul class="project-list" data-list></ul>
  </div>
</template>

<template id="tpl-project">
  <div class="page">
    <div class="board-head">
      <div>
        <a class="back" href="#/projects">All projects</a>
        <div class="project-title-row">
          <h1 data-project-name></h1>
          <span class="key-pill" data-project-key></span>
          <span class="role-badge" data-my-role></span>
        </div>
        <p class="page-sub" data-project-desc></p>
      </div>
      <div class="project-head-actions">
        <select class="switcher" data-switcher aria-label="Switch project"></select>
        <div class="page-actions" data-actions></div>
      </div>
    </div>

    <section>
      <h2 class="section-label">Boards</h2>
      <form class="create-board" data-create-board novalidate>
        <input name="name" placeholder="Board name" aria-label="Board name" required>
        <button class="btn" type="submit">Create board</button>
      </form>
      <ul class="board-list" data-boards></ul>
    </section>

    <section>
      <h2 class="section-label">Components</h2>
      <p class="page-sub" style="margin-bottom:10px">Applied to work items in this project. Owner and Admins manage the list.</p>
      <ul class="component-list" data-components></ul>
      <form class="create-component" data-create-component novalidate hidden>
        <input name="name" placeholder="Component name" aria-label="Component name" required>
        <button class="btn" type="submit">Add</button>
      </form>
    </section>

    <section>
      <h2 class="section-label">Statuses</h2>
      <p class="page-sub" style="margin-bottom:10px">The board's columns for this project, in order. Owner and Admins manage the list — each of To Do, In Progress and Done needs at least one status.</p>
      <ul class="order-list" data-statuses></ul>
      <form class="create-status" data-create-status novalidate hidden>
        <input name="name" placeholder="Status name" aria-label="Status name" required>
        <select name="category" aria-label="Category" data-category-select></select>
        <button class="btn" type="submit">Add</button>
      </form>
    </section>

    <section>
      <h2 class="section-label">Field screens</h2>
      <p class="page-sub" style="margin-bottom:10px">Which screen each work item type uses in this project. Owner and Admins choose; “None” means built-in fields only.</p>
      <ul class="assign-list" data-assignments></ul>
    </section>

    <section>
      <h2 class="section-label">Members</h2>
      <ul class="member-list" data-members></ul>
    </section>

    <section data-pending-section hidden>
      <h2 class="section-label">Invitations sent</h2>
      <ul class="invite-list" data-pending-invites></ul>
    </section>
  </div>
</template>

<template id="tpl-board">
  <div class="page">
    <div class="board-head">
      <div>
        <a class="back" data-back-link href="#/projects">Project</a>
        <h1 data-board-name></h1>
      </div>
      <p class="legend" data-type-legend></p>
    </div>
    <div class="columns" data-columns></div>
  </div>
</template>

<template id="tpl-fields">
  <div class="page page-narrow">
    <div class="page-head">
      <h1>Custom fields</h1>
      <p class="page-sub">Global — one list, shared by every project. Put them on a Screen to make them appear on a work item.</p>
    </div>

    <form class="create-field" data-create-field novalidate hidden>
      <input name="name" placeholder="Field name" aria-label="Field name" required>
      <select name="field_type" aria-label="Field type" data-type-select></select>
      <button class="btn btn-primary" type="submit">Add field</button>
    </form>
    <p class="hint" data-type-hint hidden></p>
    <p class="form-error" data-create-error hidden></p>
    <p class="locked-note" data-locked hidden></p>

    <ul class="admin-list" data-list></ul>
  </div>
</template>

<template id="tpl-screens">
  <div class="page page-narrow">
    <div class="page-head">
      <h1>Screens</h1>
      <p class="page-sub">An ordered set of custom fields. A project points each work item type at one of these.</p>
    </div>

    <form class="create-screen" data-create-screen novalidate hidden>
      <input name="name" placeholder="Screen name" aria-label="Screen name" required>
      <button class="btn btn-primary" type="submit">Add screen</button>
    </form>
    <p class="form-error" data-create-error hidden></p>
    <p class="locked-note" data-locked hidden></p>

    <ul class="admin-list" data-list></ul>
  </div>
</template>

<template id="tpl-labels">
  <div class="page page-narrow">
    <div class="page-head">
      <h1>Labels</h1>
      <p class="page-sub">Global — the same list, shared and reused across every project. Anyone tags a work item with a new label right on the item; there's no "create" button here. Owners of any project can rename, recolor, or delete one from this list.</p>
    </div>
    <p class="locked-note" data-locked hidden></p>

    <ul class="label-admin-list" data-list></ul>
  </div>
</template>

<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
