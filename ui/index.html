<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Internal tool. /robots.txt asks crawlers not to fetch this at all; this
     tag and the X-Robots-Tag header cover the one that fetches it anyway. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Tasky</title>
<!-- Absolute paths, like every other asset here, so a deep link such as
     /projects/3/boards/7 still resolves them after a refresh. -->
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-150.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-300.png">
<link rel="apple-touch-icon" href="/static/img/favicon-300.png">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div id="root"></div>

<!-- Templates ---------------------------------------------------------- -->

<template id="tpl-login">
  <div class="login">
    <form class="login-card" novalidate>
      <p class="eyebrow">Tasky</p>
      <h1>Sign in</h1>
      <p class="login-note">Accounts are created by an admin. Membership in any project is invite-only.</p>
      <label class="field">
        <span>Username</span>
        <input name="username" autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" data-error hidden></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="login-hint">Mock data: <code>asha</code>, <code>kabir</code> or <code>lena</code> — any password</p>
    </form>
  </div>
</template>

<template id="tpl-shell">
  <header class="topbar">
    <a class="brand" href="#/projects">Tasky</a>
    <nav class="nav">
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/my-tasks" data-nav="my-tasks">My tasks</a>
    </nav>
    <div class="topbar-end">
      <span class="who" data-who></span>
      <button class="btn btn-quiet" data-signout>Sign out</button>
    </div>
  </header>
  <main class="main" data-main></main>
</template>

<template id="tpl-projects">
  <div class="page page-narrow">
    <div class="page-head">
      <h1>Projects</h1>
      <p class="page-sub">Everything you're a member of. No one joins without an invite.</p>
    </div>

    <section class="invitations" data-invitations hidden>
      <h2 class="section-label">Pending invitations</h2>
      <ul class="invite-list" data-invite-list></ul>
    </section>

    <form class="create-project" data-create-project novalidate>
      <input name="name" placeholder="Project name" aria-label="Project name" required>
      <input name="key" placeholder="KEY" aria-label="Project key" maxlength="10" class="key-input" required>
      <button class="btn btn-primary" type="submit">Create project</button>
    </form>
    <p class="form-error" data-create-error hidden></p>

    <ul class="project-list" data-list></ul>
  </div>
</template>

<template id="tpl-project">
  <div class="page">
    <div class="board-head">
      <div>
        <a class="back" href="#/projects">All projects</a>
        <div class="project-title-row">
          <h1 data-project-name></h1>
          <span class="key-pill" data-project-key></span>
          <span class="role-badge" data-my-role></span>
        </div>
        <p class="page-sub" data-project-desc></p>
      </div>
      <div class="project-head-actions">
        <select class="switcher" data-switcher aria-label="Switch project"></select>
        <div class="page-actions" data-actions></div>
      </div>
    </div>

    <section>
      <h2 class="section-label">Boards</h2>
      <form class="create-board" data-create-board novalidate>
        <input name="name" placeholder="Board name" aria-label="Board name" required>
        <button class="btn" type="submit">Create board</button>
      </form>
      <ul class="board-list" data-boards></ul>
    </section>

    <section>
      <h2 class="section-label">Components</h2>
      <p class="page-sub section-note" data-component-note></p>
      <ul class="component-list" data-components></ul>
      <form class="create-component" data-create-component novalidate hidden>
        <input name="name" placeholder="Component name" aria-label="Component name" required>
        <button class="btn" type="submit">Add</button>
      </form>
    </section>

    <section>
      <h2 class="section-label">Members</h2>
      <ul class="member-list" data-members></ul>
    </section>
  </div>
</template>

<template id="tpl-board">
  <div class="page">
    <div class="board-head">
      <div>
        <a class="back" data-back-link href="#/projects">Project</a>
        <div class="project-title-row">
          <h1 data-board-name></h1>
          <span class="key-pill" data-board-project></span>
        </div>
        <p class="page-sub" data-board-desc></p>
      </div>
      <div class="legend-stack">
        <p class="legend" data-type-legend></p>
        <p class="legend">
          <span class="legend-item"><i class="rule-demo p1"></i>Low</span>
          <span class="legend-item"><i class="rule-demo p2"></i>Medium</span>
          <span class="legend-item"><i class="rule-demo p3"></i>High</span>
          <span class="legend-item"><i class="rule-demo overdue"></i>Overdue</span>
        </p>
      </div>
    </div>
    <div class="columns" data-columns></div>
  </div>
</template>

<template id="tpl-my-tasks">
  <div class="page page-narrow">
    <div class="page-head">
      <h1>My tasks</h1>
      <p class="page-sub">Everything open and assigned to you, across every project, soonest due first.</p>
    </div>
    <ul class="task-list" data-list></ul>
  </div>
</template>

<script src="/static/js/logic.js"></script>
<script src="/static/js/store.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
