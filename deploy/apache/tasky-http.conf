# Staging vhost — plain http, no certificates.
#
# Staging runs on a developer's Mac, reached at http://localhost:8000. It mirrors
# production in every other respect (gunicorn, Apache, collectstatic, DEBUG=0)
# so the only untested difference is TLS termination.
ServerName localhost

Include conf/cloudflare-ips.conf

LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" cf
CustomLog /proc/self/fd/1 cf
ErrorLog /proc/self/fd/2

<VirtualHost *:80>
    ServerName localhost

    # No RequestHeader set X-Forwarded-Proto here on purpose: staging really is
    # http, and claiming https would make Django set Secure cookies the browser
    # would then refuse to send back.

    Alias /static/ /srv/static/
    <Directory /srv/static>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        /static/ !
    ProxyPass        / http://web:8000/
    ProxyPassReverse / http://web:8000/

    LimitRequestBody 26214400

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
