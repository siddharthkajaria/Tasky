# Production vhost — tasky.tailwebs.com
#
#   Browser -> Cloudflare (proxied) -> Apache :443 -> gunicorn :8000
#
# The certificate is either a Cloudflare Origin Certificate you dropped into
# deploy/apache/certs/, or a self-signed pair the entrypoint generated on first
# boot. Cloudflare SSL/TLS mode must match:
#   real Origin Certificate -> Full (strict)
#   generated self-signed   -> Full
ServerName tasky.tailwebs.com

Include conf/cloudflare-ips.conf

LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" cf
CustomLog /proc/self/fd/1 cf
ErrorLog /proc/self/fd/2

<VirtualHost *:80>
    ServerName tasky.tailwebs.com
    RedirectPermanent / https://tasky.tailwebs.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName tasky.tailwebs.com

    SSLEngine on
    SSLCertificateFile      conf/certs/origin.pem
    SSLCertificateKeyFile   conf/certs/origin.key
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off

    RequestHeader set X-Forwarded-Proto "https"

    Alias /static/ /srv/static/
    <Directory /srv/static>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        /static/ !
    ProxyPass        / http://web:8000/
    ProxyPassReverse / http://web:8000/

    LimitRequestBody 26214400

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
