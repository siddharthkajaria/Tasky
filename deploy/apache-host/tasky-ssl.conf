# /etc/apache2/sites-available/tasky.conf
#
# PHASE 2 — TLS on the origin. Cloudflare SSL/TLS mode moves to "Full".
#
# Replaces the phase-1 file entirely: it keeps a :80 vhost, but now purely to
# redirect. Only enable this once the certificate below actually exists — a
# :443 vhost that cannot load its certificate takes Apache down for every site
# on this box, efast-staging included, because apache2ctl configtest fails and
# the reload is refused.
#
# Install:
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp deploy/apache-host/tasky-ssl.conf /etc/apache2/sites-available/tasky.conf
#   sudo apache2ctl configtest        # MUST pass before reloading
#   sudo systemctl reload apache2
#
# Then in .env.prod on the server, and redeploy:
#   DJANGO_SECURE_SSL_REDIRECT=1
#   DJANGO_HSTS_SECONDS=31536000
#
# Certificate: a Cloudflare Origin Certificate for *.tailwebs.com is the right
# choice (Cloudflare dashboard -> SSL/TLS -> Origin Server -> Create
# Certificate; valid 15 years, no renewal daemon). It is trusted only by
# Cloudflare, which is correct — this origin is not meant to be reached
# directly. If efast-staging already has a cert covering tasky.tailwebs.com,
# point at that instead rather than running two.

<VirtualHost *:80>
    ServerName tasky.tailwebs.com
    RedirectPermanent / https://tasky.tailwebs.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName tasky.tailwebs.com

    SSLEngine on
    SSLCertificateFile      /etc/ssl/tailwebs/origin.pem
    SSLCertificateKeyFile   /etc/ssl/tailwebs/origin.key
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off

    RequestHeader set X-Forwarded-Proto "https"

    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    LimitRequestBody 26214400

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog  ${APACHE_LOG_DIR}/tasky-error.log
    CustomLog ${APACHE_LOG_DIR}/tasky-access.log combined
</VirtualHost>
