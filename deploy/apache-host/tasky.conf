# /etc/apache2/sites-available/tasky.conf
#
# PHASE 1 — HTTP only. Cloudflare SSL/TLS mode must be "Flexible".
#
# This runs on the HOST (Apache 2.4.58, Ubuntu), not in a container. That Apache
# already owns :80 and :443 for efast-staging.tailwebs.com; this adds a vhost so
# tasky.tailwebs.com stops falling through to it.
#
#   Cloudflare ──► host Apache :80 ──► tasky proxy container 127.0.0.1:8081 ──► gunicorn :8000
#
# Install:
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache-host/tasky.conf /etc/apache2/sites-available/tasky.conf
#   sudo a2ensite tasky
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName tasky.tailwebs.com

    # Cloudflare terminates the visitor's TLS, so the hop into this box is plain
    # http even though the browser is on https. Django must be told the real
    # scheme (it reads this via SECURE_PROXY_SSL_HEADER, gated on
    # DJANGO_BEHIND_PROXY=1). Without it Django believes the connection is
    # insecure, refuses to send Secure cookies, and the user is signed out on
    # the request after login.
    RequestHeader set X-Forwarded-Proto "https"

    # ProxyPreserveHost keeps the original Host header, which Django's
    # ALLOWED_HOSTS check needs — it is set to tasky.tailwebs.com only.
    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    # Attachment uploads. Stopping an oversized body here avoids tying up a
    # gunicorn worker. Keep in step with the container's own LimitRequestBody.
    LimitRequestBody 26214400

    ErrorLog  ${APACHE_LOG_DIR}/tasky-error.log
    CustomLog ${APACHE_LOG_DIR}/tasky-access.log combined
</VirtualHost>

# DO NOT add a redirect to https in this vhost while Cloudflare is on
# "Flexible". Cloudflare would answer the redirect by fetching this origin over
# http again, and the browser would loop until it gives up
# (ERR_TOO_MANY_REDIRECTS). The redirect belongs in the phase-2 config, which is
# only correct once this vhost really does answer on :443.
