# /etc/apache2/sites-available/tasky.conf
#
# PHASE 1 — HTTP only. Cloudflare SSL/TLS mode must be "Flexible".
#
# This runs on the HOST (Apache 2.4.58, Ubuntu), not in a container. That Apache
# already owns :80 and :443 for efast-staging.tailwebs.com; this adds a vhost so
# tasky.tailwebs.com stops falling through to it.
#
#   Cloudflare ──► host Apache :80 ──► tasky proxy container 127.0.0.1:8081 ──► gunicorn :8000
#
# Install:
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo cp deploy/apache-host/tasky.conf /etc/apache2/sites-available/tasky.conf
#   sudo a2ensite tasky
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName tasky.tailwebs.com

    # Force every visitor onto https, while Cloudflare stays on "Flexible".
    #
    # Under Flexible, Cloudflare ALWAYS speaks plain http to this origin, so the
    # connection scheme here says nothing about what the visitor used. A blanket
    # "redirect to https" would therefore loop forever: the browser would come
    # back over https, Cloudflare would fetch this origin over http again, and
    # we would redirect again.
    #
    # Cloudflare does forward the visitor's real scheme in X-Forwarded-Proto.
    # That is the only usable signal, so redirect on it and nothing else. This
    # terminates: after one redirect the visitor is on https, Cloudflare sends
    # X-Forwarded-Proto: https, and the condition stops matching.
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # X-Forwarded-Proto is deliberately NOT overwritten here. Setting it to a
    # constant "https" is what makes the redirect above impossible, because it
    # destroys the only evidence of how the visitor actually connected. Apache
    # passes Cloudflare's own value through to the container and on to Django,
    # which reads it via SECURE_PROXY_SSL_HEADER (gated on DJANGO_BEHIND_PROXY=1)
    # to decide whether to send Secure cookies.
    #
    # NOTE: the visitor's leg is encrypted, but Cloudflare -> this origin is
    # still plaintext across the public internet. Only moving Cloudflare to
    # "Full" (phase 2) encrypts that hop.

    # ProxyPreserveHost keeps the original Host header, which Django's
    # ALLOWED_HOSTS check needs — it is set to tasky.tailwebs.com only.
    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    # Attachment uploads. Stopping an oversized body here avoids tying up a
    # gunicorn worker. Keep in step with the container's own LimitRequestBody.
    LimitRequestBody 26214400

    ErrorLog  ${APACHE_LOG_DIR}/tasky-error.log
    CustomLog ${APACHE_LOG_DIR}/tasky-access.log combined
</VirtualHost>

# DO NOT add a redirect to https in this vhost while Cloudflare is on
# "Flexible". Cloudflare would answer the redirect by fetching this origin over
# http again, and the browser would loop until it gives up
# (ERR_TOO_MANY_REDIRECTS). The redirect belongs in the phase-2 config, which is
# only correct once this vhost really does answer on :443.
