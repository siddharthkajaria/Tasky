# Production — tasky.tailwebs.com.
#
#   Cloudflare (proxied)  ->  Apache :443  ->  gunicorn :8000
#
# Only Apache is published. gunicorn is reachable solely on the compose network,
# so nothing can bypass the proxy and forge X-Forwarded-Proto.
services:
  web:
    build:
      context: .
      args:
        INSTALL_DEV: "0"          # no pytest/ruff in the production image
    image: tasky-web:prod
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.prod}
    expose:
      - "8000"
    volumes:
      - media:/app/media          # uploaded attachments must survive a redeploy
      - static:/app/staticfiles
    healthcheck:
      # Two headers, both load-bearing:
      #   Host              ALLOWED_HOSTS is just the domain, so a probe to
      #                     127.0.0.1 is rejected by Django with 400 DisallowedHost.
      #   X-Forwarded-Proto SECURE_SSL_REDIRECT=1 turns a plain-http probe into a
      #                     301, which `curl -f` treats as success — a false pass
      #                     that would mark a broken app healthy.
      # With both set this returns the real 204 the endpoint is supposed to give.
      test: ["CMD", "curl", "-fsS",
             "-H", "Host: tasky.tailwebs.com",
             "-H", "X-Forwarded-Proto: https",
             "http://127.0.0.1:8000/api/auth/csrf/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    build:
      context: ./deploy/apache
    image: tasky-proxy:prod
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Phase 1 of go-live runs TLS=off with Cloudflare on "Flexible", so the
      # origin only needs port 80. Phase 2 flips this to "on" and Cloudflare to
      # "Full". Set TASKY_TLS in .env.prod; see docs/deployment.md.
      #
      # With TLS off the :80 vhost does NOT redirect to https — under Flexible
      # that redirect would loop forever, because Cloudflare would answer the
      # redirect by fetching the origin over http again.
      TASKY_TLS: "${TASKY_TLS:-on}"
      TASKY_SERVER_NAME: "tasky.tailwebs.com"
    ports:
      # Defaults to owning the box's :80 and :443, which is right when Tasky is
      # the only thing on the server.
      #
      # If another web server already holds those ports, bind to loopback high
      # ports instead and let that server proxy to us — set in .env.prod:
      #   TASKY_HTTP_BIND=127.0.0.1:8081
      #   TASKY_HTTPS_BIND=127.0.0.1:8444
      # Loopback matters: a 0.0.0.0 high port would be reachable from the
      # internet and would bypass both the existing server and Cloudflare.
      # See docs/deployment.md, "Sharing the server".
      - "${TASKY_HTTP_BIND:-0.0.0.0:80}:80"
      - "${TASKY_HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      # Read-write: the entrypoint writes a self-signed pair here on first boot
      # if none exists. Drop a real Cloudflare Origin Certificate in to replace
      # it and switch the zone to Full (strict).
      - ./deploy/apache/certs:/usr/local/apache2/conf/certs
      - static:/srv/static:ro
    healthcheck:
      # Tries https then falls back to http, so the same healthcheck works in
      # both go-live phases. The Host header is required for the same reason as
      # the web service above.
      test: ["CMD-SHELL", "curl -fsSk -H 'Host: tasky.tailwebs.com' https://127.0.0.1/api/auth/csrf/ || curl -fsS -H 'Host: tasky.tailwebs.com' http://127.0.0.1/api/auth/csrf/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  media:
  static:
