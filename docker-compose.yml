# Local development. MySQL runs natively on the Mac, not in a container, so the
# app reaches it through host.docker.internal (inside the container "localhost"
# is the container itself). ENV_FILE lets `make stage-up` reuse this same file
# against .env.stage without a second compose file.
services:
  web:
    build:
      context: .
      args:
        INSTALL_DEV: "1"      # dev image: pytest, ruff, coverage
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: ${ENV_FILE:-.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
